      const d = document.createElement('div');
      d.className = 'tc-reveal-card';
      d.style.animationDelay = (i * 0.09) + 's';
      d.innerHTML = '<div class="rc-id id-tag">' + w.id + '</div><div class="rc-name">' + w.name + '</div>';
      cards.appendChild(d);
    });
    box.classList.add('active');
  }
  function clearReveal() {
    const box = document.getElementById('tc-reveal');
    if (box) box.classList.remove('active');
    if (typeof stageClearReveal === 'function') stageClearReveal();
  }

  /* ------------------------------------------------------------------ *
   *  6. 键盘与按钮
   * ------------------------------------------------------------------ */
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      if (p && p.catch) p.catch(() => { });
    } else if (document.exitFullscreen) document.exitFullscreen().catch(() => { });
  }

  window.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') {
      if (e.code === 'Escape') e.target.blur();
      return;
    }
    const modalOpen = $$('.tc-modal-backdrop.active').length > 0;
    if (e.code === 'Space' || e.code === 'Enter') {
      if (modalOpen) return;
      e.preventDefault();
      toggleRoll();
    } else if (e.key === 'f' || e.key === 'F') {
      e.preventDefault(); toggleFullscreen();
    } else if (e.key === 'r' || e.key === 'R') {
      e.preventDefault();
      confirmBox('确认重置本轮抽取记录吗？（学生名单不会被修改）', () => {
        resetPool(false);
        clearReveal();
        FX.clear();
        Music.sfxClick();
        toast('已重置本轮记录 🔄');
      }, '重置');
    } else if (e.key >= '1' && e.key <= '6') {
      const sel = document.getElementById('sel-count');
      if (sel && !modalOpen) { sel.value = e.key; toast('每次抽取 ' + e.key + ' 人'); Music.sfxClick(); }
    } else if (e.key === 'm' || e.key === 'M') {
      const btn = document.getElementById('btn-sound');
      if (btn) btn.click();
    } else if (e.key === 'h' || e.key === 'H') {
      const btn = document.getElementById('btn-manage');
      if (btn) btn.click();
    } else if (e.code === 'Escape') {
      $$('.tc-modal-backdrop.active').forEach(m => m.classList.remove('active'));
      clearReveal();
    }
  });

  const btnFs = document.getElementById('btn-fullscreen');
  if (btnFs) btnFs.addEventListener('click', toggleFullscreen);

  const btnBgm = document.getElementById('btn-bgm');
  if (btnBgm) btnBgm.addEventListener('click', () => {
    const on = Music.toggleBGM();
    btnBgm.textContent = on ? '🎵 氛围音: 开' : '🎵 氛围音: 关';
    btnBgm.classList.toggle('off', !on);
  });
  const btnSound = document.getElementById('btn-sound');
  if (btnSound) btnSound.addEventListener('click', () => {
    const m = Music.toggleMute();
    btnSound.textContent = m ? '🔇 音效: 关' : '🔊 音效: 开';
    btnSound.classList.toggle('off', m);
    if (btnBgm) {
      btnBgm.textContent = (!m && Music.isPlaying()) ? '🎵 氛围音: 开' : '🎵 氛围音: 关';
      btnBgm.classList.toggle('off', m || !Music.isPlaying());
    }
  });

  const selCount = document.getElementById('sel-count');
  if (selCount) selCount.addEventListener('change', () => { Music.sfxClick(); toast('每次抽取 ' + selCount.value + ' 人'); });

  /* ------------------------------------------------------------------ *
   *  7. 名单管理弹窗：导入 / 导出 / 手动编辑 / 打包进 HTML
   * ------------------------------------------------------------------ */
  const modal = document.getElementById('modal-manage');
  const txtInput = document.getElementById('txt-input');

  function openModal() {
    if (txtInput) txtInput.value = formatText(studentList);
    if (modal) modal.classList.add('active');
    Music.sfxClick();
  }
  const btnManage = document.getElementById('btn-manage');
  if (btnManage) btnManage.addEventListener('click', openModal);
  const modalClose = document.getElementById('modal-close');
  if (modalClose) modalClose.addEventListener('click', () => modal.classList.remove('active'));
  if (modal) modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('active'); });

  const btnSave = document.getElementById('btn-save-list');
  if (btnSave) btnSave.addEventListener('click', () => {
    const text = (txtInput.value || '').trim();
    if (!text) { toast('名单内容不能为空！'); return; }
    const list = parseText(text);
    if (!list.length) { toast('没有解析到有效名单，请检查格式'); return; }
    saveStudents(text);
    studentList = list;
    resetPool(true);
    clearReveal();
    if (typeof onResetHook === 'function') onResetHook();
    modal.classList.remove('active');
    toast('已保存 ' + list.length + ' 位同学，全部模板同步生效 ✅');
    Music.sfxClick();
  });

  const btnRestore = document.getElementById('btn-restore-default');
  if (btnRestore) btnRestore.addEventListener('click', () => {
    confirmBox('确认恢复为本页面内置的默认名单吗？', () => {
      localStorage.removeItem(PKEY);
      localStorage.removeItem(PKEY_V1);
      studentList = parseText(DEFAULT_RAW);
      saveStudents(DEFAULT_RAW);
      if (txtInput) txtInput.value = DEFAULT_RAW;
      resetPool(true);
      clearReveal();
      if (typeof onResetHook === 'function') onResetHook();
      modal.classList.remove('active');
      toast('已恢复默认名单（' + studentList.length + ' 人）');
    }, '恢复默认');
  });

  const fileInput = document.getElementById('file-input');
  const btnImport = document.getElementById('btn-import-txt');
  if (btnImport) btnImport.addEventListener('click', () => fileInput && fileInput.click());
  if (fileInput) fileInput.addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = evt => {
      const raw = String(evt.target.result || '').replace(/^\uFEFF/, '');
      const list = parseText(raw);
      if (!list.length) { toast('文件里没读到有效名单，请检查格式'); return; }
      saveStudents(raw);
      studentList = list;
      resetPool(true);
      clearReveal();
      if (typeof onResetHook === 'function') onResetHook();
      if (txtInput) txtInput.value = formatText(list);
      toast('已导入【' + f.name + '】共 ' + list.length + ' 人，已同步生效 ✅');
      Music.sfxClick();
    };
    reader.readAsText(f, 'utf-8');
    fileInput.value = '';
  });

  const btnExport = document.getElementById('btn-export-txt');
  if (btnExport) btnExport.addEventListener('click', () => {
    download('班级名单.txt', (txtInput && txtInput.value) ? txtInput.value : formatText(studentList));
    toast('名单已导出为 班级名单.txt 💾');
  });

  function download(filename, text, mime) {
    const blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }

  /* 把当前名单直接打包进一份新的 HTML（导入/修改的内容直接填充到 html） */
  const btnExportHtml = document.getElementById('btn-export-html');
  if (btnExportHtml) btnExportHtml.addEventListener('click', () => {
    const raw = (txtInput && txtInput.value.trim()) ? txtInput.value.trim() : formatText(studentList);
    exportHtmlWith(raw);
  });

  function exportHtmlWith(raw) {
    download('点名系统-名单已内嵌.html', buildExportHtml(raw), 'text/html');
    toast('已导出一份「名单已内嵌」的 HTML，可直接分发给学生机 ✅', 3200);
  }

  /* 返回一份「名单已写死在源码里」的完整 HTML 字符串 */
  function buildExportHtml(raw) {
    const clone = document.documentElement.cloneNode(true);
    clone.querySelectorAll('[data-dyn]').forEach(el => { el.innerHTML = ''; });
    clone.querySelectorAll('[data-fitsize]').forEach(el => {
      el.style.gridTemplateColumns = ''; el.style.gridAutoRows = ''; el.style.gap = '';
    });
    clone.querySelectorAll('.active').forEach(el => el.classList.remove('active'));
    clone.querySelectorAll('.screen-shake,.hopping,.flipped,.rolling,.on,.picked,.lit,.open,.cracked')
      .forEach(el => el.classList.remove('screen-shake', 'hopping', 'flipped', 'rolling', 'on', 'picked', 'lit', 'open', 'cracked'));
    clone.querySelectorAll('textarea').forEach(t => { t.textContent = ''; });
    clone.querySelectorAll('select').forEach(s => {
      const d = s.querySelector('option[selected]');
      s.value = d ? d.value : (s.options[0] && s.options[0].value) || '';
      Array.from(s.options).forEach(o => o.removeAttribute('selected'));
      if (d) d.setAttribute('selected', 'selected');
    });
    clone.querySelectorAll('input[type=checkbox]').forEach(i => {
      i.checked = i.hasAttribute('checked');
      i.removeAttribute('data-checked');
      if (i.checked) i.setAttribute('checked', 'checked'); else i.removeAttribute('checked');
    });
    const bt = clone.querySelector('#btn-text'); if (bt) bt.textContent = ORIG_TEXT;
    const bi = clone.querySelector('#btn-icon'); if (bi) bi.textContent = ORIG_ICON;
    const bs = clone.querySelector('#btn-start'); if (bs) bs.classList.remove('stop');
    const b1 = clone.querySelector('#btn-bgm'); if (b1) { b1.textContent = '🎵 氛围音: 开'; b1.classList.remove('off'); }
    const b2 = clone.querySelector('#btn-sound'); if (b2) { b2.textContent = '🔊 音效: 开'; b2.classList.remove('off'); }

    let html = '<!DOCTYPE html>\n' + clone.outerHTML;
    const marker = /(const DEFAULT_STUDENTS_RAW = ")([^"]*)(";)/;
    if (marker.test(html)) {
      html = html.replace(marker, (m, p1, p2, p3) => p1 + raw.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n') + p3);
    }
    return html;
  }

  /* ------------------------------------------------------------------ *
   *  8. 跨标签页同步 + 尝试读取同目录 班级名单.txt
   * ------------------------------------------------------------------ */
  window.addEventListener('storage', e => {
    if (e.key === PKEY && e.newValue && e.newValue.trim()) {
      studentList = parseText(e.newValue);
      resetPool(true);
      clearReveal();
      if (typeof onResetHook === 'function') onResetHook();
      toast('名单已从其它页面同步更新 ✅');
    }
  });

  window.addEventListener('focus', () => {
    const saved = readSaved();
    if (saved && formatText(studentList) !== formatText(parseText(saved))) {
      studentList = parseText(saved);
      resetPool(true);
      clearReveal();
      if (typeof onResetHook === 'function') onResetHook();
    }
  });

  function tryLocalTxt() {
    if (readSaved()) return;                       // 已有用户数据，不覆盖
    if (!location.protocol.startsWith('http')) return; // file:// 下浏览器禁止读取，静默跳过
    fetch('班级名单.txt', { cache: 'no-store' })
      .then(r => r.ok ? r.text() : null)
      .then(t => {
        if (!t) return;
        const list = parseText(t);
        if (!list.length) return;
        studentList = list;
        saveStudents(t);
        resetPool(true);
        if (typeof onResetHook === 'function') onResetHook();
      })
      .catch(() => { });
  }

  /* ------------------------------------------------------------------ *
   *  9. 启动
   * ------------------------------------------------------------------ */
  let booted = false;
  function boot() {
    if (booted) return;
    booted = true;
    loadStudents();
    Music.initAutoPlay();
    if (typeof stageInit === 'function') stageInit();
    setTimeout(tryLocalTxt, 300);

    /* 舞台尺寸变化时重排主题网格 */
    let rt = null;
    const relayout = () => {
      clearTimeout(rt);
      rt = setTimeout(() => {
        if (typeof stageLayout === 'function') stageLayout();
        const box = document.querySelector('.fit-grid');
        if (box && box._relayout) box._relayout();
      }, 120);
    };
    window.addEventListener('resize', relayout);
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(relayout);
      const stage = document.querySelector('.tc-stage');
      if (stage) ro.observe(stage);
    }
  }

  document.addEventListener('DOMContentLoaded', boot);
  if (document.readyState !== 'loading') boot();

  /* ------------------------------------------------------------------ *
   *  10. 对外暴露给模板脚本
   * ------------------------------------------------------------------ */
  window.TC = {
    $, $$, rand, randInt, pick, clamp, toast, confirmBox, autoFitGrid,
    Music, SoundFX: Music, FX,
    get students() { return studentList; },
    get remain() { return remainPool; },
    get history() { return historyList; },
    get rolling() { return rolling; },
    pickWinners, resetPool, pushHistory, clearReveal, defaultReveal,
    setBtn, toggleRoll, download, parseText, formatText,
    buildExportHtml, exportHtmlWith,
    isNoRepeat: noRepeat, getCount
  };
})();


/* ===== 主题舞台脚本：幸运大转盘 ===== */
/* ── 幸运大转盘 · 舞台脚本 ─────────────────────────────────────────── */

var wheelStage = TC.$('#wheel-stage');
var wheelBox = TC.$('#wheel-box');
var wheelCv = TC.$('#wheel-cv');
var wctx = wheelCv ? wheelCv.getContext('2d') : null;
var wheelHub = TC.$('#wheel-hub');
var wheelRead = TC.$('#wheel-readout');
var wlReveal = TC.$('#wl-reveal');
var wlNames = TC.$('#wl-names');

var wN = 0, wSec = Math.PI * 2, viewS = 0, secColor = [], secName = [];
var wheelRaf = null, bulbStep = 0, lastIdx = -1, readIdx = -2;
var wRollTimer = null, wRollT0 = 0, wRevealTimer = null, wSettleAt = 0;
var WHEEL_MAXSP = 0.42;
var spin = { mode: 'idle', angle: 0, speed: 0, from: 0, to: 0, t0: 0, dur: 0 };

/* ---------- 转盘几何 ---------- */
function wheelFit() {
  if (!wheelStage || !wheelBox) return;
  var w = wheelStage.clientWidth, h = wheelStage.clientHeight;
  if (!w || !h) return;
  /* 舞台是唯一可靠的尺寸来源：按实测舞台宽高算，绝不写死 px */
  var s = Math.max(150, Math.min(h * 0.855, w * 0.62));
  wheelBox.style.width = s + 'px';
  wheelBox.style.height = s + 'px';
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  wheelCv.width = Math.round(s * dpr);
  wheelCv.height = Math.round(s * dpr);
  wctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  viewS = s;
}

function buildWheel() {
  secName = TC.students.map(function (s) { return s.name; });
  wN = secName.length;
  wSec = wN ? (Math.PI * 2 / wN) : (Math.PI * 2);
  secColor = [];
  for (var i = 0; i < wN; i++) secColor.push(i % 2 ? '#ef4444' : '#f59e0b');
  spin.mode = 'idle'; spin.angle = 0; spin.speed = 0; spin.from = 0; spin.to = 0;
  lastIdx = -1; readIdx = -2;
  if (wheelHub) wheelHub.textContent = '点名';
  setReadout(wN ? '准备转动' : '没有名单');
}

/* 指针当前咬住的扇区序号 */
function sectorUnderPointer() {
  if (!wN) return -1;
  var L = (-Math.PI / 2 - spin.angle) % (Math.PI * 2);
  if (L < 0) L += Math.PI * 2;
  var i = Math.floor(L / wSec) % wN;
  return i < 0 ? i + wN : i;
}

function setReadout(txt) {
  if (wheelRead) wheelRead.textContent = txt;
}

/* ---------- 绘制 ---------- */
function drawWheel() {
  if (!wctx || !viewS) return;
  var W = viewS;
  var cx = W / 2, cy = W / 2;
  var R = W / 2 * 0.845;
  var secR = R * 0.925;
  var bulbR = R * 1.105;
  var bulbDot = Math.max(2.2, R * 0.031);
  var rolling = (spin.mode === 'rolling' || spin.mode === 'stopping');

  wctx.clearRect(0, 0, W, W);

  /* 外圈暖色光晕 */
  var halo = wctx.createRadialGradient(cx, cy, secR * 0.6, cx, cy, R * 1.22);
  halo.addColorStop(0, 'rgba(245,158,11,.28)');
  halo.addColorStop(0.7, 'rgba(239,68,68,.14)');
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  wctx.fillStyle = halo;
  wctx.fillRect(0, 0, W, W);

  /* 跑马灯灯泡（不随转盘旋转） */
  var NB = 28, k = Math.floor(bulbStep);
  for (var b = 0; b < NB; b++) {
    var ba = b / NB * Math.PI * 2 - Math.PI / 2;
    var bx = cx + Math.cos(ba) * bulbR;
    var by = cy + Math.sin(ba) * bulbR;
    var on = ((b + k) % 2) === 0;
    var a = rolling ? (on ? 1 : 0.16) : (on ? 0.78 : 0.34);
    var bg = wctx.createRadialGradient(bx - bulbDot * 0.3, by - bulbDot * 0.3, 0, bx, by, bulbDot);
    bg.addColorStop(0, 'rgba(255,255,255,' + (a * 0.98).toFixed(2) + ')');
    bg.addColorStop(0.55, 'rgba(253,224,71,' + (a * 0.92).toFixed(2) + ')');
    bg.addColorStop(1, 'rgba(180,83,9,' + (a * 0.35).toFixed(2) + ')');
    wctx.beginPath(); wctx.arc(bx, by, bulbDot, 0, 6.284);
    wctx.fillStyle = bg;
    wctx.shadowBlur = a * 16; wctx.shadowColor = 'rgba(253,224,71,' + a.toFixed(2) + ')';
    wctx.fill();
    wctx.shadowBlur = 0;
  }

  wctx.save();
  wctx.translate(cx, cy);

  /* 金色轮辋 */
  wctx.beginPath(); wctx.arc(0, 0, R, 0, 6.284);
  wctx.fillStyle = '#7c2d12'; wctx.fill();
  wctx.beginPath(); wctx.arc(0, 0, R * 0.975, 0, 6.284);
  wctx.fillStyle = '#fbbf24'; wctx.fill();
  wctx.beginPath(); wctx.arc(0, 0, R * 0.945, 0, 6.284);
  wctx.fillStyle = '#b45309'; wctx.fill();

  /* 扇形 */
  wctx.save();
  wctx.rotate(spin.angle);
  if (wN) {
    for (var i = 0; i < wN; i++) {
      var a0 = i * wSec, a1 = a0 + wSec;
      wctx.beginPath();
      wctx.moveTo(0, 0);
      wctx.arc(0, 0, secR, a0, a1);
      wctx.closePath();
      wctx.fillStyle = secColor[i];
      wctx.fill();
      if (wN <= 26) {
        wctx.strokeStyle = 'rgba(255,255,255,.30)';
        wctx.lineWidth = Math.max(0.6, secR * 0.005);
        wctx.beginPath();
        wctx.moveTo(0, 0);
        wctx.lineTo(Math.cos(a0) * secR, Math.sin(a0) * secR);
        wctx.stroke();
      }
    }
  } else {
    wctx.beginPath(); wctx.arc(0, 0, secR, 0, 6.284);
    wctx.fillStyle = '#78350f'; wctx.fill();
  }
  wctx.restore();

  /* 中央暗角 + 边沿高光，做出凹面立体感 */
  var sh = wctx.createRadialGradient(0, 0, 0, 0, 0, secR);
  sh.addColorStop(0, 'rgba(20,6,0,.62)');
  sh.addColorStop(0.42, 'rgba(20,6,0,.10)');
  sh.addColorStop(0.82, 'rgba(255,255,255,.05)');
  sh.addColorStop(1, 'rgba(255,255,255,.22)');
  wctx.beginPath(); wctx.arc(0, 0, secR, 0, 6.284);
  wctx.fillStyle = sh; wctx.fill();

  /* 扇区文字：学生数 <= 20 才写，保证不糊成一片 */
  if (wN && wN <= 20) {
    wctx.save();
    wctx.rotate(spin.angle);
    wctx.textBaseline = 'middle';
    for (var j = 0; j < wN; j++) {
      var txt = secName[j];
      if (!txt) continue;
      if (txt.length > 6) txt = txt.slice(0, 6);
      var fs = Math.min(22, secR * wSec * 0.55,
        (secR * 0.58) / Math.max(2, txt.length));
      fs = Math.max(9, fs);
      wctx.save();
      wctx.rotate((j + 0.5) * wSec);
      var m = ((j + 0.5) * wSec) % 6.284;
      if (m < 0) m += 6.284;
      wctx.font = '900 ' + fs.toFixed(1) + 'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      wctx.fillStyle = '#2a1004';
      wctx.shadowBlur = 4; wctx.shadowColor = 'rgba(255,255,255,.45)';
      if (m > 1.5708 && m < 4.7124) {
        wctx.rotate(Math.PI);
        wctx.textAlign = 'left';
        wctx.fillText(txt, -secR * 0.90, 0);
      } else {
        wctx.textAlign = 'right';
        wctx.fillText(txt, secR * 0.90, 0);
      }
      wctx.restore();
    }
    wctx.restore();
  }

  wctx.restore();
}

function wheelLoop() {
  var now = Date.now();
  if (spin.mode === 'rolling') {
    spin.speed += (WHEEL_MAXSP - spin.speed) * 0.022;
    spin.angle += spin.speed;
  } else if (spin.mode === 'stopping') {
    var t = Math.min(1, (now - spin.t0) / spin.dur);
    spin.angle = spin.from + (spin.to - spin.from) * (1 - Math.pow(1 - t, 4));
    if (t >= 1) {
      spin.mode = 'idle';
      spin.angle = spin.to % (Math.PI * 2);
      spin.speed = 0;
      onWheelLocked();
    }
  }
  bulbStep += (spin.mode === 'idle' ? 0.045 : 0.17);

  /* 指针读数：只在扇区变化时写 DOM，避免每帧抖动 */
  if (spin.mode !== 'idle' && wN) {
    var id = sectorUnderPointer();
    if (id !== readIdx) {
      readIdx = id;
      setReadout(secName[id] || '');
    }
  }
  drawWheel();
  wheelRaf = requestAnimationFrame(wheelLoop);
}

/* 指针咬死扇区的一刻：局部火花 + 冲击环（全屏礼花由内核统一负责） */
function onWheelLocked() {
  if (wheelHub) wheelHub.textContent = 'GO';
  var r = wheelCv.getBoundingClientRect();
  var px = r.left + r.width / 2;
  var py = r.top + r.height * 0.03;
  TC.FX.sparks(px, py, 30, '#fde047');        /* 指针处迸火花 */
  TC.FX.ring(px, py, '#f59e0b', 0, 3);
  /* 彩带从转盘中心炸开：FX 的粒子是「向上抛 + 重力」，贴顶发射会飞出屏幕 */
  TC.FX.emojiBurst(r.left + r.width / 2, r.top + r.height * 0.5,
    ['🎉', '🎊', '✨', '🪙'], 12);
  var i = sectorUnderPointer();
  readIdx = i;
  setReadout(secName[i] || '');
}

/* ---------- 生命周期钩子 ---------- */
function stageInit() {
  wheelFit();
  buildWheel();
  if (!wheelRaf) wheelLoop();
  window.addEventListener('resize', wheelFit);
}

function stageLayout() {
  wheelFit();
  drawWheel();
}

function stageStartRoll() {
  if (wRevealTimer) { clearTimeout(wRevealTimer); wRevealTimer = null; }
  if (wlReveal) wlReveal.classList.remove('active');
  if (wheelHub) wheelHub.textContent = '转';
  spin.from = spin.angle;
  spin.speed = 0.09;
  spin.mode = 'rolling';
  readIdx = -2;
  if (wRollTimer) clearInterval(wRollTimer);
  wRollT0 = Date.now();
  var tick = 0;
  wRollTimer = setInterval(function () {
    var pr = Math.min(1, (Date.now() - wRollT0) / 2600);
    TC.Music.sfxRoll(pr);                       /* 摇人脉冲，每拍必响 */
    if (tick % 3 === 0 && !TC.Music.isMuted()) {
      var c = TC.Music.init();
      if (c) {
        /* 指针拨动声：短促方波，随速度升调 */
        TC.Music.tone(TC.Music.midi(76 + (tick % 7)), c.currentTime, 0.035, 0.030,
          'square', null, { cut: 6200 });
      }
    }
    tick++;
  }, 56);
}

function stageStopRoll(winners) {
  if (wRollTimer) { clearInterval(wRollTimer); wRollTimer = null; }
  if (!winners || !winners.length || !wN) return;

  /* 只对准第 1 位中选者，其余交给揭晓浮层 */
  var wi = 0;
  for (var i = 0; i < wN; i++) {
    if (TC.students[i].id === winners[0].id && TC.students[i].name === winners[0].name) { wi = i; break; }
  }
  /* 求角度：让第 wi 扇区中心正对顶部指针（-PI/2），并至少再转两圈 */
  var aim = -Math.PI / 2 - (wi + 0.5) * wSec;
  var turns = Math.ceil((spin.angle + Math.PI * 4 - aim) / (Math.PI * 2));
  spin.from = spin.angle;
  spin.to = aim + turns * Math.PI * 2;
  spin.t0 = Date.now();
  spin.dur = 1700;
  spin.mode = 'stopping';
  wSettleAt = spin.t0 + spin.dur + 90;

  /* 减速摩擦火花，沿轮辋洒一圈 */
  var r = wheelCv.getBoundingClientRect();
  for (var k = 0; k < 3; k++) {
    (function (kk) {
      setTimeout(function () {
        var an = -Math.PI / 2 + (kk - 1) * 0.9;
        TC.FX.sparks(r.left + r.width / 2 + Math.cos(an) * r.width * 0.42,
          r.top + r.height / 2 + Math.sin(an) * r.height * 0.42, 8, '#fbbf24');
      }, 240 + kk * 380);
    })(k);
  }
}

function revealWinners(winners) {
  if (wRevealTimer) clearTimeout(wRevealTimer);
  /* 等转盘停稳再弹浮层，让「指针咬住扇区」这一下有完整的呼吸 */
  var wait = Math.max(0, wSettleAt - Date.now());
  wRevealTimer = setTimeout(function () { showWheelReveal(winners); }, wait);
}

function showWheelReveal(winners) {
  if (!wlReveal) return;
  if (wlNames) wlNames.innerHTML = '';
  wlReveal.classList.add('active');            /* 先显示，autoFitGrid 才量得到尺寸 */

  for (var i = 0; i < winners.length; i++) {
    var d = document.createElement('div');
    d.className = 'wl-one';
    d.style.animationDelay = (i * 0.1) + 's';
    d.innerHTML = '<div class="wid id-tag"></div><div class="wnm"></div>';
    d.querySelector('.wid').textContent = 'No.' + winners[i].id;
    d.querySelector('.wnm').textContent = winners[i].name;
    wlNames.appendChild(d);
  }
  /* 1~6 个中奖卡片也必须完整落在浮层里，不滚动、不裁切 */
  var r = TC.autoFitGrid(wlNames, winners.length, {
    gap: 12, ratio: 0.62, minW: 130, maxW: 460, pad: 6
  });
  if (r) {
    var fs = Math.max(20, Math.min(Math.round(r.cw * 0.30), 88));
    var kids = wlNames.children;
    for (var j = 0; j < kids.length; j++) {
      kids[j].querySelector('.wnm').style.fontSize = fs + 'px';
      kids[j].querySelector('.wid').style.fontSize = Math.max(10, Math.round(fs * 0.24)) + 'px';
    }
  }
}

function stageClearReveal() {
  if (wRevealTimer) { clearTimeout(wRevealTimer); wRevealTimer = null; }
  if (wlReveal) wlReveal.classList.remove('active');
}

function onResetHook() {
  if (wRollTimer) { clearInterval(wRollTimer); wRollTimer = null; }
  if (wRevealTimer) { clearTimeout(wRevealTimer); wRevealTimer = null; }
  if (wlReveal) wlReveal.classList.remove('active');
  buildWheel();
  drawWheel();
}

function themedPillStyle(el) {
  el.style.background = 'rgba(245,158,11,.18)';
  el.style.border = '1px solid rgba(239,68,68,.62)';
  el.style.color = '#fde68a';
}

</script>
