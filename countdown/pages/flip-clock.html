<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>复古拟物机械翻页钟倒计时 - 离线全屏版</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    :root {
      --bg: #0f1013;
      --card-bg: #22252a;
      --card-top: #1e2025;
      --card-text: #eceff4;
      --hinge: #111215;
      --accent: #e59866;
    }
    [data-theme="retro"] {
      --bg: #2b2520;
      --card-bg: #3d342c;
      --card-top: #362e27;
      --card-text: #eedcbb;
      --hinge: #1e1814;
      --accent: #d4a373;
    }
    body {
      background-color: var(--bg);
      color: var(--card-text);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background-color 0.4s ease;
      position: relative;
    }

    /* 顶部导航与模式切换 */
    .top-nav {
      position: absolute;
      top: 24px;
      left: 32px;
      right: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    .back-btn {
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 1px;
      padding: 6px 14px;
      border-radius: 6px;
      background: rgba(255,255,255,0.05);
      transition: all 0.2s;
    }
    .back-btn:hover {
      background: rgba(255,255,255,0.15);
      color: #fff;
    }
    .clock-title {
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.7;
    }

    /* 翻页钟主体容器 */
    .flip-wrapper {
      display: flex;
      align-items: center;
      gap: clamp(10px, 2.5vw, 28px);
      perspective: 1200px;
      z-index: 10;
    }

    /* 单组双位数 (时/分/秒) */
    .flip-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .flip-group-digits {
      display: flex;
      gap: 6px;
    }
    .group-label {
      font-size: 12px;
      letter-spacing: 3px;
      margin-top: 14px;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
      font-weight: bold;
    }

    /* 翻牌卡片单个数字骨架 */
    .flip-unit {
      position: relative;
      width: clamp(55px, 9vw, 105px);
      height: clamp(80px, 13vw, 150px);
      font-size: clamp(50px, 8vw, 96px);
      font-weight: 700;
      font-family: 'Helvetica Neue', 'Arial Black', Arial, sans-serif;
      border-radius: 8px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6);
    }

    /* 翻页卡片切半 */
    .card-top, .card-bottom, .card-flip-back, .card-flip-front {
      position: absolute;
      left: 0;
      width: 100%;
      height: 50%;
      overflow: hidden;
      background: var(--card-bg);
      color: var(--card-text);
      text-align: center;
      line-height: clamp(80px, 13vw, 150px);
    }
    .card-top {
      top: 0;
      background: var(--card-top);
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.4);
    }
    .card-bottom {
      bottom: 0;
      line-height: 0;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
    }

    /* 机械中轴铰链线 */
    .flip-unit::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: calc(50% - 1.5px);
      height: 3px;
      background: var(--hinge);
      z-index: 5;
      box-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    /* 翻动层 */
    .card-flip-front {
      top: 0;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      background: var(--card-top);
      transform-origin: bottom center;
      backface-visibility: hidden;
      z-index: 2;
    }
    .card-flip-back {
      bottom: 0;
      line-height: 0;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
      transform-origin: top center;
      transform: rotateX(180deg);
      backface-visibility: hidden;
      z-index: 3;
    }

    /* 动画触发 class */
    .flip-unit.animating .card-flip-front {
      animation: flipTop 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .flip-unit.animating .card-flip-back {
      animation: flipBottom 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes flipTop {
      0% { transform: rotateX(0deg); }
      100% { transform: rotateX(-180deg); }
    }
    @keyframes flipBottom {
      0% { transform: rotateX(180deg); }
      100% { transform: rotateX(0deg); }
    }

    /* 冒号分隔 */
    .colon-separator {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 0 4px;
      margin-bottom: 24px;
    }
    .colon-dot {
      width: clamp(6px, 1vw, 12px);
      height: clamp(6px, 1vw, 12px);
      border-radius: 50%;
      background: var(--card-bg);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.8), 0 1px 1px rgba(255,255,255,0.1);
    }

    /* 底部悬浮操作控制区 */
    .bottom-bar {
      position: absolute;
      bottom: 28px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(20, 22, 26, 0.85);
      backdrop-filter: blur(14px);
      padding: 10px 24px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      z-index: 30;
      transition: opacity 0.3s ease;
      max-width: 96vw;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .bottom-bar::-webkit-scrollbar {
      display: none;
    }
    .bottom-bar.autohide {
      opacity: 0.15;
    }
    .bottom-bar:hover, .bottom-bar.autohide:hover {
      opacity: 1;
    }

    button {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--card-text);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      letter-spacing: 1px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    button:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.4);
      transform: scale(1.04);
    }
    button.primary {
      background: #e59866;
      border-color: #e59866;
      color: #111;
      font-weight: bold;
    }

    .theme-toggle {
      font-size: 12px;
      opacity: 0.8;
    }

    /* 自定义弹窗 */
    .flip-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 120;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .flip-modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .flip-modal-card {
      background: var(--card-bg);
      border: 1px solid var(--accent);
      padding: 26px 32px;
      border-radius: 14px;
      text-align: center;
      width: 340px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8);
      color: var(--card-text);
    }
    .flip-modal-title {
      font-size: 16px;
      color: var(--accent);
      letter-spacing: 2px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .flip-inputs-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .flip-input-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .flip-input-col input {
      width: 65px;
      height: 48px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      outline: none;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }
    .flip-input-col input:focus {
      border-color: var(--accent);
    }
    .flip-input-col span {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
    }

    /* 自定义任务名称输入条 */
    .task-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: clamp(14px, 3vh, 32px);
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 30px;
      padding: 8px 24px;
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
      z-index: 15;
    }
    .task-bar:focus-within {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(229, 152, 102, 0.35);
    }
    .task-icon {
      font-size: 20px;
      opacity: 0.9;
    }
    .task-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--card-text);
      font-size: clamp(18px, 2.4vw, 28px);
      font-weight: 700;
      text-align: center;
      min-width: 240px;
      max-width: 500px;
      letter-spacing: 1.5px;
      font-family: inherit;
    }
    .task-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
      font-weight: normal;
      font-size: clamp(15px, 2vw, 22px);
    }
  </style>
</head>
<body>

  <div class="top-nav">
    <a href="../index.html" class="back-btn">← 大厅主页</a>
    <div class="clock-title" id="modeTitle">MECHANICAL FLIP CLOCK // COUNTDOWN</div>
  </div>

  <!-- 自定义任务名称 -->
  <div class="task-bar">
    <span class="task-icon">🎯</span>
    <input type="text" id="taskInput" class="task-input" placeholder="输入专注任务名..." maxlength="40" spellcheck="false" autocomplete="off">
  </div>

  <div class="flip-wrapper">
    <!-- 小时 -->
    <div class="flip-group" id="flipHoursGroup">
      <div class="flip-group-digits">
        <div class="flip-unit" id="h0"><div class="card-top">0</div><div class="card-bottom">0</div></div>
        <div class="flip-unit" id="h1"><div class="card-top">0</div><div class="card-bottom">0</div></div>
      </div>
      <div class="group-label">HOURS</div>
    </div>

    <div class="colon-separator" id="flipHoursColon">
      <div class="colon-dot"></div>
      <div class="colon-dot"></div>
    </div>

    <!-- 分钟 -->
    <div class="flip-group">
      <div class="flip-group-digits">
        <div class="flip-unit" id="m0"><div class="card-top">1</div><div class="card-bottom">1</div></div>
        <div class="flip-unit" id="m1"><div class="card-top">5</div><div class="card-bottom">5</div></div>
      </div>
      <div class="group-label">MINUTES</div>
    </div>

    <div class="colon-separator">
      <div class="colon-dot"></div>
      <div class="colon-dot"></div>
    </div>

    <!-- 秒钟 -->
    <div class="flip-group">
      <div class="flip-group-digits">
        <div class="flip-unit" id="s0"><div class="card-top">0</div><div class="card-bottom">0</div></div>
        <div class="flip-unit" id="s1"><div class="card-top">0</div><div class="card-bottom">0</div></div>
      </div>
      <div class="group-label">SECONDS</div>
    </div>
  </div>

  <div class="bottom-bar" id="controlsBar">
    <button class="primary" id="btnToggle">▶ 开始 (Space)</button>
    <button id="btnReset">↺ 重置 (R)</button>
    <button onclick="setPreset(300)">5分钟</button>
    <button onclick="setPreset(900)">15分钟</button>
    <button onclick="setPreset(1500)">25分钟</button>
    <button id="btnCustom">⚙ 自定义</button>
    <button class="theme-toggle" id="btnTheme">🎨 切换主题</button>
    <button id="btnSound">🔊 机械音: 开</button>
    <button id="btnFullscreen">⛶ 全屏 (F)</button>
  </div>

  <!-- 自定义时长弹窗 -->
  <div class="flip-modal-overlay" id="flipModal">
    <div class="flip-modal-card">
      <div class="flip-modal-title">设置翻页倒计时时长</div>
      <div class="flip-inputs-row">
        <div class="flip-input-col">
          <input type="number" id="flipH" min="0" max="99" value="0">
          <span>小时</span>
        </div>
        <div class="flip-input-col">
          <input type="number" id="flipM" min="0" max="59" value="15">
          <span>分钟</span>
        </div>
        <div class="flip-input-col">
          <input type="number" id="flipS" min="0" max="59" value="0">
          <span>秒钟</span>
        </div>
      </div>
      <div style="display: flex; gap: 12px; justify-content: center;">
        <button class="primary" id="btnApplyFlip" style="padding: 8px 24px;">确定</button>
        <button onclick="closeFlipModal()" style="padding: 8px 18px;">取消</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================
       纯离线 Web Audio 仿真机械翻页物理微动卡嗒声 (Click / Clack)
       ========================================================== */
    class FlipSound {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playClick() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        
        // 瞬间轻微白噪声突发冲击模拟机械接触
        const bufferSize = this.ctx.sampleRate * 0.025;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.2));
        }
        const source = this.ctx.createBufferSource();
        source.buffer = buffer;

        // 高通与低通滤波器模拟塑料卡片摩擦弹击
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1400, now);
        filter.Q.setValueAtTime(2, now);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);

        source.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        source.start(now);
      }
    }

    const sound = new FlipSound();

    /* ==========================================================
       3D 翻页动效引擎
       ========================================================== */
    function flipDigit(unitEl, newValue) {
      const curTop = unitEl.querySelector('.card-top');
      const curBottom = unitEl.querySelector('.card-bottom');
      const currentValue = curTop.textContent;

      if (currentValue === newValue) return;

      // 移除旧动效节点
      const oldFront = unitEl.querySelector('.card-flip-front');
      const oldBack = unitEl.querySelector('.card-flip-back');
      if (oldFront) oldFront.remove();
      if (oldBack) oldBack.remove();
      unitEl.classList.remove('animating');

      // 创建翻动卡片
      const flipFront = document.createElement('div');
      flipFront.className = 'card-flip-front';
      flipFront.textContent = currentValue;

      const flipBack = document.createElement('div');
      flipBack.className = 'card-flip-back';
      flipBack.textContent = newValue;

      curTop.textContent = newValue;

      unitEl.appendChild(flipFront);
      unitEl.appendChild(flipBack);

      void unitEl.offsetWidth; // 触发回流重绘
      unitEl.classList.add('animating');

      sound.playClick();

      setTimeout(() => {
        curBottom.textContent = newValue;
        flipFront.remove();
        flipBack.remove();
        unitEl.classList.remove('animating');
      }, 500);
    }

    /* ==========================================================
       倒计时逻辑
       ========================================================== */
    let totalSeconds = 15 * 60; // 默认15分钟
    let remainingSec = totalSeconds;
    let hasHoursSet = false;
    let isRunning = false;
    let timerId = null;

    const uH0 = document.getElementById('h0');
    const uH1 = document.getElementById('h1');
    const uM0 = document.getElementById('m0');
    const uM1 = document.getElementById('m1');
    const uS0 = document.getElementById('s0');
    const uS1 = document.getElementById('s1');
    const btnToggle = document.getElementById('btnToggle');

    function pad2(n) { return n < 10 ? '0' + n : '' + n; }

    function renderTime(seconds, animate = true) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;

      const strH = pad2(h);
      const strM = pad2(m);
      const strS = pad2(s);

      const flipHGroup = document.getElementById('flipHoursGroup');
      const flipHColon = document.getElementById('flipHoursColon');
      if (hasHoursSet || h > 0) {
        if (flipHGroup) flipHGroup.style.display = 'flex';
        if (flipHColon) flipHColon.style.display = 'flex';
        if (animate) {
          flipDigit(uH0, strH[0]);
          flipDigit(uH1, strH[1]);
        } else {
          uH0.querySelector('.card-top').textContent = uH0.querySelector('.card-bottom').textContent = strH[0];
          uH1.querySelector('.card-top').textContent = uH1.querySelector('.card-bottom').textContent = strH[1];
        }
      } else {
        if (flipHGroup) flipHGroup.style.display = 'none';
        if (flipHColon) flipHColon.style.display = 'none';
      }

      if (animate) {
        flipDigit(uM0, strM[0]);
        flipDigit(uM1, strM[1]);
        flipDigit(uS0, strS[0]);
        flipDigit(uS1, strS[1]);
      } else {
        uM0.querySelector('.card-top').textContent = uM0.querySelector('.card-bottom').textContent = strM[0];
        uM1.querySelector('.card-top').textContent = uM1.querySelector('.card-bottom').textContent = strM[1];
        uS0.querySelector('.card-top').textContent = uS0.querySelector('.card-bottom').textContent = strS[0];
        uS1.querySelector('.card-top').textContent = uS1.querySelector('.card-bottom').textContent = strS[1];
      }
    }

    function startTimer() {
      sound.init();
      if (remainingSec <= 0) remainingSec = totalSeconds;
      isRunning = true;
      btnToggle.textContent = '⏸ 暂停 (Space)';
      btnToggle.classList.add('primary');

      timerId = setInterval(() => {
        if (remainingSec > 0) {
          remainingSec--;
          renderTime(remainingSec, true);
        } else {
          pauseTimer();
        }
      }, 1000);
    }

    function pauseTimer() {
      isRunning = false;
      clearInterval(timerId);
      btnToggle.textContent = '▶ 开始 (Space)';
      btnToggle.classList.remove('primary');
    }

    function toggleTimer() {
      if (isRunning) pauseTimer();
      else startTimer();
    }

    function resetTimer(sec) {
      pauseTimer();
      if (sec !== undefined) totalSeconds = sec;
      remainingSec = totalSeconds;
      renderTime(remainingSec, false);
    }

    function setPreset(sec) {
      hasHoursSet = false;
      resetTimer(sec);
      startTimer();
    }

    btnToggle.addEventListener('click', toggleTimer);
    document.getElementById('btnReset').addEventListener('click', () => resetTimer());

    // 初始化渲染初始时间
    renderTime(remainingSec, false);

    /* ==========================================================
       主题与全屏
       ========================================================= */
    const btnTheme = document.getElementById('btnTheme');
    let isRetroTheme = false;
    btnTheme.addEventListener('click', () => {
      isRetroTheme = !isRetroTheme;
      if (isRetroTheme) {
        document.body.setAttribute('data-theme', 'retro');
        btnTheme.textContent = '🎨 现代极简';
      } else {
        document.body.removeAttribute('data-theme');
        btnTheme.textContent = '🎨 复古原木';
      }
    });

    const btnSound = document.getElementById('btnSound');
    btnSound.addEventListener('click', () => {
      sound.enabled = !sound.enabled;
      btnSound.textContent = sound.enabled ? '🔊 机械音: 开' : '🔇 机械音: 关';
    });

    const btnFullscreen = document.getElementById('btnFullscreen');
    function toggleFs() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
    btnFullscreen.addEventListener('click', toggleFs);

    document.addEventListener('dblclick', (e) => {
      if (e.target.closest('button, a, input, select, textarea')) return;
      toggleFs();
    });

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
        if (e.target.id === 'taskInput') {
          if (e.key === 'Enter') e.target.blur();
          return;
        }
        if (e.key === 'Enter') document.getElementById('btnApplyFlip').click();
        if (e.key === 'Escape') closeFlipModal();
        return;
      }
      if (e.code === 'Space') {
        e.preventDefault();
        toggleTimer();
      } else if (e.key === 'r' || e.key === 'R') {
        resetTimer();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFs();
      } else if (e.key === 'c' || e.key === 'C') {
        openFlipModal();
      }
    });

    // 自定义任务名持久化与交互
    const taskInput = document.getElementById('taskInput');
    const savedTask = localStorage.getItem('countdown_task_name') || '';
    if (savedTask) taskInput.value = savedTask;
    taskInput.addEventListener('input', () => {
      localStorage.setItem('countdown_task_name', taskInput.value);
    });
    taskInput.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Enter') taskInput.blur();
    });

    // 自定义时长弹窗逻辑
    const flipModal = document.getElementById('flipModal');
    const flipH = document.getElementById('flipH');
    const flipM = document.getElementById('flipM');
    const flipS = document.getElementById('flipS');
    const btnCustom = document.getElementById('btnCustom');

    function openFlipModal() {
      const curH = Math.floor(totalSeconds / 3600);
      const curM = Math.floor((totalSeconds % 3600) / 60);
      const curS = totalSeconds % 60;
      flipH.value = curH;
      flipM.value = curM;
      flipS.value = curS;
      flipModal.classList.add('open');
      flipM.focus();
    }
    function closeFlipModal() {
      flipModal.classList.remove('open');
    }
    if (btnCustom) {
      btnCustom.addEventListener('click', openFlipModal);
    }
    document.getElementById('btnApplyFlip').addEventListener('click', () => {
      const h = parseInt(flipH.value, 10) || 0;
      const m = parseInt(flipM.value, 10) || 0;
      const s = parseInt(flipS.value, 10) || 0;
      const total = h * 3600 + m * 60 + s;
      if (total > 0) {
        hasHoursSet = (h > 0);
        closeFlipModal();
        resetTimer(total);
        startTimer();
      }
    });
    flipModal.addEventListener('click', (e) => {
      if (e.target === flipModal) closeFlipModal();
    });

    const controlsBar = document.getElementById('controlsBar');
    let hideTimer = null;
    window.addEventListener('mousemove', () => {
      controlsBar.classList.remove('autohide');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        if (isRunning) controlsBar.classList.add('autohide');
      }, 3500);
    });
  </script>
</body>
</html>
